name: Megatron-LM manual review caller contract
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  manual-light-review:
    if: github.event.issue.pull_request
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_claude_review.yml@0123456789abcdef0123456789abcdef01234567
    with:
      review_mode: manual
      review_profile: light
      trigger_phrase: /mcore review light
      prompt: |
        Apply the Megatron-LM light review policy to correctness and regression risks.
        Report only concrete policy findings supported by the immutable review context.

  manual-strict-review:
    if: github.event.issue.pull_request
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_claude_review.yml@0123456789abcdef0123456789abcdef01234567
    with:
      review_mode: manual
      review_profile: strict
      trigger_phrase: /mcore review strict
      prompt: |
        Apply the Megatron-LM strict review policy to correctness, security, and performance risks.
        Report only concrete policy findings supported by the immutable review context.
